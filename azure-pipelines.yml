trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"
    displayName: Use Python 3.12

  - script: python -m pip install --disable-pip-version-check -r requirements.txt
    displayName: Install application dependencies

  - script: python -m compileall -q backend/app
    displayName: Check Python source compilation

  - task: CopyFiles@2
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: |
        backend/**
        !backend/venv/**
        !backend/**/__pycache__/**
        frontend/**
        database/schema.sql
        requirements.txt
        Procfile
        README.md
      TargetFolder: $(Build.ArtifactStagingDirectory)/urban-sneakers
    displayName: Prepare deployment artifact

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/urban-sneakers
      ArtifactName: urban-sneakers
      publishLocation: Container
    displayName: Publish application artifact
